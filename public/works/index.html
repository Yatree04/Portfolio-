<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Works — Yatri Patel</title>
    <meta name="description" content="Selected product management and UX strategy work by Yatri Patel." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Darker+Grotesque:wght@500;600&family=Fragment+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/site.css" />
  </head>
  <body data-page="works">
    <main>
      <section class="hero">
        <h1>Hey I am Yatri !</h1>
        <p>I am a designer who loves meeting new people and exploring new perspectives.</p>
      </section>

      <section class="works" id="works">
        <h2>Featured Works</h2>
        <div class="works-grid">
          <div class="works-col" data-col="0"></div>
          <div class="works-col" data-col="1"></div>
        </div>
      </section>
    </main>

    <script src="../assets/site.js"></script>
    <script src="projects.js"></script>
    <script>
      (function () {
        var projects = window.WORKS_PROJECTS || [];
        var cols = document.querySelectorAll('.works-col');

        function esc(value) {
          return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
          });
        }

        /* `embed` takes either the URL or the whole <iframe> snippet copied
           out of Behance's Share -> Embed dialog */
        function embedSrc(value) {
          var m = /src\s*=\s*["']([^"']+)["']/i.exec(value);
          return m ? m[1] : value;
        }

        function iframeFor(project) {
          return (
            '<iframe src="' + esc(embedSrc(project.embed)) + '" loading="lazy" ' +
            'allowfullscreen allow="clipboard-write" ' +
            'referrerpolicy="strict-origin-when-cross-origin" ' +
            'title="' + esc(project.title || 'Project') + ' on Behance"></iframe>'
          );
        }

        /* Cover art first — that is the tile in the design. A project whose
           cover is not in the repo yet falls back to its Behance embed, so
           adding the file is all it takes to switch a tile over. */
        function media(project) {
          if (project.image) {
            return '<img src="' + esc(project.image) + '" alt="' + esc(project.title) + '" loading="lazy" />';
          }
          if (project.embed) return iframeFor(project);
          return '<div class="placeholder"></div>';
        }

        projects.forEach(function (project, i) {
          /* an embed is interactive and links to Behance on its own, so those
             cards are plain containers rather than anchors */
          var card = document.createElement(project.embed ? 'div' : 'a');
          card.className = 'card';
          card.style.setProperty('--order', i);   /* keeps source order when the
                                                     grid collapses to one column */
          if (!project.embed) {
            card.href = project.url || '#';
            if (/^https?:/.test(card.getAttribute('href'))) {
              card.target = '_blank';
              card.rel = 'noopener';
            }
          }

          card.innerHTML =
            '<div class="card-media">' +
              media(project) +
              (project.status === 'under-construction'
                ? '<span class="card-badge">under construction</span>'
                : '') +
            '</div>' +
            /* a Behance embed already shows the title, so the text block is
               only rendered for the fields that are actually filled in */
            (project.eyebrow || project.title || project.description
              ? '<div class="card-text">' +
                  (project.eyebrow ? '<p class="card-eyebrow"></p>' : '') +
                  (project.title ? '<h3 class="card-title"></h3>' : '') +
                  (project.description ? '<p class="card-desc"></p>' : '') +
                '</div>'
              : '');

          var set = function (sel, value) {
            var el = card.querySelector(sel);
            if (el) el.textContent = value;
          };
          set('.card-eyebrow', project.eyebrow);
          set('.card-title', project.title);
          set('.card-desc', project.description);

          /* If the cover file is not there yet, show what we do have. */
          var cover = card.querySelector('.card-media img');
          if (cover) {
            cover.addEventListener('error', function () {
              var box = card.querySelector('.card-media');
              box.innerHTML = project.embed
                ? iframeFor(project)
                : '<div class="placeholder"></div>';
            });
          }

          cols[i % cols.length].appendChild(card);
        });
      })();
    </script>
  </body>
</html>
